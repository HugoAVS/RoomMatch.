services:
  db:
    image: postgres:16-alpine
    container_name: roommatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rommatch
    # 5433 en el equipo para no chocar con otro PostgreSQL que ya use el 5432.
    ports:
      - "5433:5432"
    volumes:
      - roommatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rommatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roommatch-pgdata:
